development:
  clients:
    default:
      uri: <%= ENV.fetch("MONGODB_URI", "mongodb://localhost:27017/parser_guard_development") %>
      options:
        server_selection_timeout: 5
  options:
    raise_not_found_error: false

test:
  clients:
    default:
      # One database per test process so parallel runs (CI shards, multiple terminals) never truncate each other.
      uri: <%= ENV.fetch("MONGODB_TEST_URI", "mongodb://localhost:27017/parser_guard_test_#{ENV.fetch('TEST_ENV_NUMBER', Process.pid)}") %>
      options:
        read:
          mode: :primary
        max_pool_size: 1
        server_selection_timeout: 5
  options:
    raise_not_found_error: false

production:
  clients:
    default:
      uri: <%= ENV["MONGODB_URI"] %>
      options:
        server_selection_timeout: 5
  options:
    raise_not_found_error: false
